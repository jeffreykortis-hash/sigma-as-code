<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Allocation Floor Plan — Theory Sigma Plugin</title>
<script src="https://unpkg.com/@sigmacomputing/plugin"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,Inter,Segoe UI,Roboto,Arial,sans-serif;background:transparent;color:#f2f2f2;overflow:hidden}
  #wrap{height:100%;width:100%;display:flex;flex-direction:column;padding:10px 14px;gap:8px}
  #top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:0 0 auto;flex-wrap:wrap}
  #ttl{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#D97459}
  #meta{font-size:11px;color:#9a9a9a} #meta b{color:#fff}
  .seg{display:inline-flex;border:1px solid #3a3a3a;border-radius:8px;overflow:hidden;margin-left:6px}
  .seg button{border:0;background:#0f0f10;color:#f2f2f2;font:inherit;font-size:11px;padding:4px 9px;cursor:pointer}
  .seg button.on{background:#D97459;color:#fff}
  #main{flex:1;min-height:0;display:flex;gap:10px}
  #stage{flex:1 1 62%;min-width:0;min-height:0}
  #plan{width:100%;height:100%;display:block}
  #side{flex:0 0 34%;min-width:170px;overflow:auto;font-size:12px;border-left:1px solid #2a2a2a;padding-left:10px}
  #side h3{font-size:13px;margin-bottom:2px} #side .sub{color:#9a9a9a;margin-bottom:6px}
  .row{display:grid;grid-template-columns:96px 1fr 48px;gap:6px;align-items:center;margin:3px 0}
  .row i{display:block;height:7px;border-radius:4px;background:#D97459}
  .row .t{background:#2a2a2a;height:7px;border-radius:4px}
  .row b{text-align:right;font-weight:600}
  .zone{cursor:pointer;outline:none}
  .zone rect,.zone polygon{stroke:#2c2c2c;stroke-width:2}
  .zone:hover rect,.zone:hover polygon{filter:brightness(.94)}
  .zone.sel rect,.zone.sel polygon{stroke:#e11d48;stroke-width:5}
  .zl{font-size:17px;fill:#1b1f24;pointer-events:none} .zv{font-size:20px;font-weight:700;fill:#1b1f24;pointer-events:none}
  .lt{fill:#fff}
  #tip{position:fixed;pointer-events:none;background:#D97459;border-radius:8px;padding:6px 9px;font-size:11px;color:#000;opacity:0;z-index:10;white-space:nowrap}
  @media (max-width:560px){#main{flex-direction:column}#side{flex:0 0 38%;border-left:0;padding-left:0;border-top:1px solid #2a2a2a;padding-top:6px}}
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <div><span id="ttl">Allocation floor plan</span> <span id="meta"><b id="tot">—</b> units · <b id="nz">—</b> rooms with stock</span></div>
    <div><span class="seg" id="secSeg"></span><span class="seg" id="modeSeg"><button data-m="heat" class="on">Heat</button><button data-m="area">Areas</button></span></div>
  </div>
  <div id="main"><div id="stage"><svg id="plan" xmlns="http://www.w3.org/2000/svg" viewBox="290 150 1140 1190"></svg></div><div id="side"></div></div>
</div>
<div id="tip"></div>
<script>
(function(){
  var client=(window.sigmaComputing&&window.sigmaComputing.plugin&&window.sigmaComputing.plugin.client)||null;
  var NS='http://www.w3.org/2000/svg';
  var ZONES=[{"id":"warehouse","name":"Warehouse","type":"cultivation","poly":[1112,236,1295,236,1295,390,1355,390,1355,1122,1175,1122,1175,1052,690,1052,690,666,1112,666],"label":[1235,545],"aliases":["warehouse"]},{"id":"cult1","name":"Cultivation Storage #1","type":"cultivation","rect":[340,261,66,270],"aliases":["cultivation storage"]},{"id":"dry1","name":"Dry Room 1 #2","type":"cultivation","rect":[420,261,63,270],"aliases":["dry room 1"]},{"id":"dry2","name":"Dry Room 2 #3","type":"cultivation","rect":[493,261,60,270],"aliases":["dry room 2"]},{"id":"cult4","name":"Cultivation Pod #4","type":"cultivation","rect":[563,261,63,270],"aliases":["pod #4","pod 4"]},{"id":"trim","name":"Trim Room","type":"cultivation","rect":[336,582,244,110],"aliases":["trim"]},{"id":"cult5","name":"Cultivation Pod #5","type":"cultivation","rect":[352,752,64,273],"aliases":["pod #5","pod 5"]},{"id":"cult6","name":"Cultivation Pods #6","type":"cultivation","rect":[416,752,65,273],"aliases":["pod #6","pod 6"]},{"id":"cult7","name":"Cultivation Pod #7","type":"cultivation","rect":[482,752,65,273],"aliases":["pod #7","pod 7"]},{"id":"cult8","name":"Cultivation Pod #8","type":"cultivation","rect":[548,752,63,273],"aliases":["pod #8","pod 8"]},{"id":"boiler","name":"Boiler Room","type":"manufacturing","rect":[661,236,339,196],"aliases":["boiler"]},{"id":"etoh","name":"ETOH Extraction","type":"manufacturing","rect":[661,432,296,88],"aliases":["etoh"]},{"id":"seltzer","name":"Seltzer/Beverage Lab","type":"manufacturing","rect":[661,520,264,145],"aliases":["seltzer","beverage lab"]},{"id":"extraction","name":"Extraction","type":"medical","rect":[925,490,185,175],"aliases":["extraction"]},{"id":"mip","name":"MIP Lab","type":"medical","rect":[961,357,149,163],"aliases":["mip"]},{"id":"cage","name":"Cage","type":"manufacturing","rect":[1019,674,85,95],"aliases":["cage"]},{"id":"pod13","name":"Cultivation Pod #13","type":"cultivation","rect":[693,734,313,53],"aliases":["pod #13"]},{"id":"pod12","name":"Cultivation Pods #12","type":"cultivation","rect":[693,789,313,53],"aliases":["pod #12"]},{"id":"msp11","name":"Manufacturing Storage Pod #11","type":"manufacturing","rect":[693,855,313,53],"aliases":["storage pod #11"]},{"id":"msp10","name":"Manufacturing Storage Pod #10","type":"manufacturing","rect":[693,910,313,53],"aliases":["storage pod #10"]},{"id":"msp9","name":"Manufacturing Storage Pod #9","type":"manufacturing","rect":[693,966,313,53],"aliases":["storage pod #9"]},{"id":"vault","name":"Vault","type":"manufacturing","rect":[334,1056,156,79],"aliases":["vault"]},{"id":"security","name":"Security/NVR","type":"cultivation","rect":[498,1056,58,56],"aliases":["security","nvr"]},{"id":"office","name":"Office Space","type":"cultivation","rect":[334,1140,346,110],"aliases":["office"]},{"id":"retail","name":"Retail","type":"retail","rect":[700,1108,472,147],"aliases":["retail","sales floor"]},{"id":"bath","name":"Bathroom","type":"cultivation","rect":[888,1056,140,52],"aliases":["bathroom"]},{"id":"uniform","name":"Uniform Room","type":"cultivation","rect":[1178,1055,172,100],"aliases":["uniform"]},{"id":"noncann","name":"Non-cannabis Storage","type":"cultivation","rect":[1178,1160,227,92],"aliases":["non-cannabis"]}];
  var AREA={"cultivation":"#d9ffd5","manufacturing":"#d5d5ff","medical":"#f4d5f4","retail":"#fbdcc8"};
  var EXITS=[{"name":"Grow Facility Entrance","x":1098,"y":210},{"name":"Exit","x":680,"y":1285},{"name":"Retail Entrance/Exit","x":1135,"y":1290}];
  var ESCAPE=[[382,557,592,557],[386,721,590,721],[640,283,640,1005],[794,343,996,343],[1092,276,1092,640],[750,645,1082,645],[680,1040,680,1240],[1306,1038,1156,1038],[880,1212,1034,1212],[1103,1178,1103,1244]];

  var defs=[
    {name:'source',type:'element'},
    {name:'room',type:'column',source:'source',label:'Source room / zone'},
    {name:'units',type:'column',source:'source',allowedTypes:['number','integer'],label:'Units'},
    {name:'section',type:'column',source:'source',label:'Section (Pick / Wholesale / Unallocated)'},
    {name:'category',type:'column',source:'source',label:'Category'},
    {name:'selectedZone',type:'variable',label:'Selected zone (text control)'},
    {name:'onZoneSelect',type:'action-trigger',label:'On zone select'},
    {name:'zoneMap',type:'text',label:'Room -> zone overrides (JSON)',defaultValue:'{}'}
  ];
  if(client) client.config.configureEditorPanel(defs);

  function zoneOf(room,map){
    var r=String(room==null?'':room).toLowerCase();
    if(map[r]) return map[r];
    var best=null,len=0;
    ZONES.forEach(function(z){(z.aliases||[]).forEach(function(a){ if(r.indexOf(a)>=0&&a.length>len){best=z.id;len=a.length;} });});
    return best;
  }
  function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
  function fmt(v){return Math.round(v).toLocaleString();}
  function ramp(v,max){ if(!v)return null; var t=Math.min(1,Math.sqrt(v/max)); return 'hsl(14 62% '+(90-t*38)+'%)'; }
  var tip=document.getElementById('tip');

  var st={cfg:{},data:null,unsub:null,rows:null,section:'All',mode:'heat',sel:null,synthetic:true};

  // rows: {zone, section, category, units}
  function synth(){
    // deterministic sample shaped like the real run: most units in Vault / MIP Lab
    var rooms=['vault','vault','vault','mip','mip','extraction','seltzer','msp11','msp10','msp9','cage','warehouse','retail'];
    var cats=['Vapes','Gummies','Beverages','Flower','Preroll','Concentrates'], secs=['Pick','Wholesale','Unallocated'], out=[];
    for(var i=0;i<120;i++) out.push({zone:rooms[i%rooms.length],section:secs[i%3],category:cats[(i*5)%cats.length],units:20+(i*37)%380});
    return out;
  }
  function build(){
    var c=st.cfg||{},d=st.data,map={};
    try{map=JSON.parse(c.zoneMap||'{}');}catch(e){}
    if(d&&c.room&&c.units&&d[c.units]){
      var room=d[c.room]||[],u=d[c.units]||[],sec=c.section?d[c.section]:null,cat=c.category?d[c.category]:null,rows=[];
      for(var i=0;i<u.length;i++){ var z=zoneOf(room[i],map); rows.push({zone:z,section:sec?String(sec[i]):'All',category:cat?String(cat[i]):'—',units:Number(u[i])||0}); }
      st.rows=rows; st.synthetic=false;
    } else { st.rows=synth(); st.synthetic=true; }
  }
  function totals(){
    var t={},sum=0,secs={};
    st.rows.forEach(function(r){ secs[r.section]=1; if(st.section!=='All'&&r.section!==st.section)return; if(!r.zone)return; t[r.zone]=(t[r.zone]||0)+r.units; sum+=r.units; });
    return {t:t,sum:sum,secs:Object.keys(secs).sort()};
  }
  function select(id){
    st.sel=(st.sel===id)?null:id; draw();
    if(!client) return;
    var c=st.cfg||{};
    try{ if(c.selectedZone){ var z=ZONES.filter(function(z){return z.id===st.sel;})[0]; client.setVariable(c.selectedZone, z?z.name:''); }
         if(c.onZoneSelect) client.triggerAction(c.onZoneSelect); }catch(e){}
  }
  function draw(){
    var T=totals(), svg=document.getElementById('plan'); svg.innerHTML='';
    var defsEl=el('defs',{},svg), mk=el('marker',{id:'ar',viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:14,markerHeight:14,markerUnits:'userSpaceOnUse',orient:'auto'},defsEl);
    el('path',{d:'M0 0 L10 5 L0 10 z',fill:'#8a4fb5'},mk);
    el('rect',{x:330,y:236,width:1085,height:1020,fill:'#f4f1ee',stroke:'#333','stroke-width':3},svg);
    var max=1; for(var k in T.t) if(T.t[k]>max)max=T.t[k];
    ZONES.forEach(function(z){
      var v=T.t[z.id]||0, fill=(st.mode==='heat'&&ramp(v,max))||AREA[z.type];
      var g=el('g',{'class':'zone'+(st.sel===z.id?' sel':''),tabindex:0,role:'button','aria-label':z.name+' '+(v?fmt(v)+' units':'no data')},svg), shp;
      if(z.poly) shp=el('polygon',{points:z.poly.join(' '),fill:fill},g); else shp=el('rect',{x:z.rect[0],y:z.rect[1],width:z.rect[2],height:z.rect[3],fill:fill},g);
      var cx=z.rect?z.rect[0]+z.rect[2]/2:z.label[0], cy=z.rect?z.rect[1]+z.rect[3]/2:z.label[1];
      var tall=z.rect&&z.rect[3]>z.rect[2]*2, dark=st.mode==='heat'&&v/max>0.35, tr=tall?'rotate(-90 '+cx+' '+cy+')':null;
      var t1=el('text',{x:cx,y:cy-(v?8:0),'text-anchor':'middle','class':'zl'+(dark?' lt':'')},g); t1.textContent=z.name.replace(/ #\d+$/,''); if(tr)t1.setAttribute('transform',tr);
      if(v){ var t2=el('text',{x:cx,y:cy+16,'text-anchor':'middle','class':'zv'+(dark?' lt':'')},g); t2.textContent=fmt(v); if(tr)t2.setAttribute('transform',tr); }
      g.addEventListener('click',function(){select(z.id);});
      g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')select(z.id);});
      g.addEventListener('mousemove',function(e){tip.style.opacity=1;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';tip.textContent=z.name+' — '+(v?fmt(v)+' units':'no data');});
      g.addEventListener('mouseleave',function(){tip.style.opacity=0;});
    });
    ESCAPE.forEach(function(l){ el('line',{x1:l[0],y1:l[1],x2:l[2],y2:l[3],stroke:'#8a4fb5','stroke-width':5,'stroke-opacity':.5,'marker-end':'url(#ar)','pointer-events':'none'},svg); });
    EXITS.forEach(function(e){ var t=el('text',{x:e.x,y:e.y,'text-anchor':'middle',fill:'#c0262d','font-size':17},svg); t.textContent=e.name; });
    var n=0; for(var k2 in T.t) if(T.t[k2]>0)n++;
    document.getElementById('tot').textContent=fmt(T.sum); document.getElementById('nz').textContent=n;
    // section buttons
    var seg=document.getElementById('secSeg'); seg.innerHTML='';
    ['All'].concat(T.secs.filter(function(s){return s!=='All';})).forEach(function(s){
      var b=document.createElement('button'); b.textContent=s; if(st.section===s)b.className='on'; b.onclick=function(){st.section=s;draw();}; seg.appendChild(b); });
    // side panel
    var side=document.getElementById('side'), z=ZONES.filter(function(z){return z.id===st.sel;})[0];
    if(!z){ side.innerHTML='<h3>Top rooms</h3><div class="sub">'+(st.synthetic?'Sample data — bind a source in the editor panel. ':'')+'Click a room for its categories.</div>';
      ZONES.filter(function(z){return T.t[z.id];}).sort(function(a,b){return T.t[b.id]-T.t[a.id];}).slice(0,8).forEach(function(z){ row(side,z.name,T.t[z.id],T.t[ZONES.filter(function(q){return T.t[q.id];}).sort(function(a,b){return T.t[b.id]-T.t[a.id];})[0].id]); });
    } else {
      var by={}; st.rows.forEach(function(r){ if(r.zone!==z.id)return; if(st.section!=='All'&&r.section!==st.section)return; by[r.category]=(by[r.category]||0)+r.units; });
      var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a];});
      side.innerHTML='<h3>'+z.name+'</h3><div class="sub">'+fmt(T.t[z.id]||0)+' units</div>';
      ks.forEach(function(k){ row(side,k,by[k],by[ks[0]]); });
      if(!ks.length) side.innerHTML+='<div class="sub">No allocation lines in this room.</div>';
    }
  }
  function row(p,label,v,max){ var d=document.createElement('div'); d.className='row'; d.innerHTML='<span>'+label+'</span><div class="t"><i style="width:'+(max?v/max*100:0)+'%"></i></div><b>'+fmt(v)+'</b>'; p.appendChild(d); }
  document.getElementById('modeSeg').addEventListener('click',function(e){ var m=e.target.getAttribute&&e.target.getAttribute('data-m'); if(!m)return; st.mode=m;
    [].forEach.call(this.children,function(b){b.className=b.getAttribute('data-m')===m?'on':'';}); draw(); });
  function refresh(){ build(); draw(); }
  if(window.ResizeObserver) new ResizeObserver(function(){}).observe(document.getElementById('stage')); // svg scales via viewBox; observer keeps layout live
  if(client){ client.config.subscribe(function(cfg){ st.cfg=cfg||{};
    if(st.unsub){st.unsub();st.unsub=null;}
    if(cfg&&cfg.source){ st.unsub=client.elements.subscribeToElementData(cfg.source,function(dd){ st.data=dd; refresh(); }); }
    refresh(); });
  } else { refresh(); }
})();
</script>
</body>
</html>
